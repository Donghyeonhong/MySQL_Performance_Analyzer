<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="logo">PERFORMANCE <span>LAB</span></div>

            <div class="workspace_menu">
                <p>WORKSPACE</p>
                <a href="{{ url_for('index') }}">Dashboard</a>
                <a href="{{ url_for('experiments') }}" class="active">Experiments</a>
                <a href="{{ url_for('performance_analysis') }}">Performance Analysis</a>
            </div>

            <div class="system_menu">
                <p>SYSTEM</p>
                <a href="#">Settings</a>
            </div>
        </div>

        <div class="content">
            <div class="top_header">
                <div class="page_title">
                    <h1>Experiments</h1>
                    <p>MySQL Performance Monitoring</p>
                </div>

                <div class="header_info">
                    <p>2026. 11. 04.</p>
                    <span>● System Ready</span>
                </div>
            </div>

            <div class="main_content">
                <div class="experiment_form">
                    <h2>Add New Experiment</h2>

                    <form method="POST">
                        <div class="form_group">
                            <label for="experiment_name">실험 이름</label>
                            <input type="text" id="experiment_name" name="experiment_name" required>
                        </div>

                        <div class="form_group">
                            <label for="description">실험 설명</label>
                            <textarea id="description" name="description" rows="4"></textarea>
                        </div>

                        <button type="submit">Create Experiment</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
